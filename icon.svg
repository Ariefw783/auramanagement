<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#233044"/>
      <stop offset="100%" stop-color="#141D2B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#33445E" stroke-width="6"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="4" stroke-dasharray="8 8"/>

  <!-- Chef Hat / Culinary Crown (100% Bebas dari Ikon Petir) -->
  <g transform="translate(0, -10)">
    <!-- Base band of chef hat -->
    <rect x="180" y="290" width="152" height="38" rx="8" fill="url(#gold)"/>
    <line x1="200" y1="309" x2="312" y2="309" stroke="#78350F" stroke-width="3" stroke-linecap="round"/>

    <!-- Hat puffs / crowns -->
    <path d="M190 290 C150 250, 160 190, 210 185 C220 140, 292 140, 302 185 C352 190, 362 250, 322 290 Z" fill="url(#cyan)"/>
    <path d="M210 185 C220 140, 292 140, 302 185" fill="none" stroke="#E0F2FE" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Text Branding DAPUR MOM FITRI -->
    <text x="256" y="380" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="url(#gold)" text-anchor="middle" letter-spacing="3">MOM FITRI</text>
    <text x="256" y="415" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="4">DAPUR KONSINYASI</text>
  </g>
</svg>
